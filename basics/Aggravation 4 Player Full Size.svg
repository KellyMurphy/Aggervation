  <g id="Text">
    <g>
      <text class="cls-6" transform="translate(394.56 448.03)"><tspan class="cls-8"><tspan x="0" y="0">A: </tspan><tspan x="20.66" y="0">Get out of Base or Move 1</tspan></tspan><tspan class="cls-8"><tspan x="0" y="25.49">K: </tspan><tspan x="20.66" y="25.49">Get out of Base or Move 13</tspan></tspan><tspan class="cls-8"><tspan x="0" y="50.98">J: </tspan><tspan x="18.09" y="50.98">Moves Peg </tspan><tspan class="cls-12" x="99.94" y="50.98">1</tspan><tspan x="107.41" y="50.98" xml:space="preserve">1.  Next Player must play a card and not move </tspan></tspan><tspan class="cls-8"><tspan x="19.81" y="69.58">piece, if next player also lays a jack, the e</tspan><tspan class="cls-13" x="305.87" y="69.58">f</tspan><tspan x="309.89" y="69.58">fect moves to next </tspan></tspan><tspan class="cls-8"><tspan x="19.81" y="88.18">player</tspan></tspan><tspan class="cls-8"><tspan x="0" y="113.67">10:</tspan><tspan x="22.4" y="113.67">Player must swap one of their pegs in play with another peg </tspan></tspan><tspan class="cls-8"><tspan x="19.81" y="132.27">in pla</tspan><tspan class="cls-12" x="56.86" y="132.27">y</tspan><tspan x="63.46" y="132.27">, this is the only card that can move a blocking peg </tspan></tspan><tspan class="cls-8"><tspan x="19.81" y="150.88">from its start space.</tspan></tspan><tspan class="cls-8"><tspan x="0" y="176.37">7: </tspan><tspan x="18.09" y="176.37">Acts as 7 1</tspan><tspan class="cls-13" x="94.77" y="176.37">’</tspan><tspan x="97.93" y="176.37">s and can be split amongst players pegs in pla</tspan><tspan class="cls-12" x="415.89" y="176.37">y</tspan><tspan x="422.49" y="176.37">, if </tspan></tspan><tspan class="cls-8"><tspan x="19.81" y="194.97">player moves over a piece that piece returns to base. 7</tspan><tspan class="cls-13" x="397.21" y="194.97">’</tspan><tspan x="400.37" y="194.97">s </tspan></tspan><tspan class="cls-8"><tspan x="19.81" y="213.57">cannot be used to remove peg from base.</tspan></tspan><tspan class="cls-8"><tspan x="0" y="239.06">6: </tspan><tspan x="18.09" y="239.06">Player must move one of their pegs backwards 6 holes.</tspan></tspan><tspan class="cls-8"><tspan x="0" y="264.55">All Other cards:</tspan><tspan x="116.29" y="264.55" xml:space="preserve"> move face value.</tspan></tspan><tspan class="cls-8"><tspan x="0" y="290.04">Start Spot: </tspan><tspan class="cls-14" x="83.53" y="290.04">A</tspan><tspan x="93.01" y="290.04" xml:space="preserve"> peg moved directly from base to start using an </tspan></tspan><tspan class="cls-8"><tspan x="19.81" y="308.64">Ace or King blocks all pegs behind it &amp; other pegs may not </tspan></tspan><tspan class="cls-8"><tspan x="19.81" y="327.24">jump over or kill it. Does not apply to a piece moved back to </tspan></tspan><tspan class="cls-8"><tspan x="19.81" y="345.84">start from pla</tspan><tspan class="cls-12" x="110.26" y="345.84">y</tspan><tspan x="116.86" y="345.84">. </tspan></tspan><tspan class="cls-8"><tspan x="0" y="371.33">Home: </tspan><tspan x="52.54" y="371.33">Pegs in Home are safe and cannot be killed, Pegs may </tspan></tspan><tspan class="cls-8"><tspan x="19.81" y="389.93">not jump another peg in the home spots.</tspan></tspan><tspan class="cls-8" x="0" y="418.42">Deal:</tspan><tspan class="cls-8" x="37.91" y="418.42"> </tspan><tspan class="cls-10" x="42.21" y="418.42">4 Player - One 5 Card Hand &amp;</tspan><tspan class="cls-10"><tspan x="19.81" y="440.02" xml:space="preserve">                    </tspan><tspan class="cls-11" x="119.83" y="440.02"> </tspan><tspan class="cls-9" x="124.5" y="440.02">T</tspan><tspan x="134.5" y="440.02">wo 4 card hands per deal.</tspan></tspan></text>
