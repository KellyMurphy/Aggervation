# Run the Aggravation website:
#   docker compose up --build -d     then open http://localhost:8000
#   docker compose logs -f           watch it
#   docker compose down              stop it
# Use a different port on your machine with:  AGGRAVATION_PORT=8080 docker compose up -d
services:
  web:
    build: .
    image: aggravation
    ports:
      - "${AGGRAVATION_PORT:-8000}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      AGGRAVATION_BOT_DELAY: ${AGGRAVATION_BOT_DELAY:-1.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/layout')"]
      interval: 30s
      timeout: 5s
      retries: 3
