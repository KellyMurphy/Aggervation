[project]
name = "aggervation"
version = "0.1.0"
description = "Aggeravation Pygame Project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pygame>=2.6.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aggervation"]

[dependency-groups]
dev = [
    "httpx>=0.29.0",
    "pytest>=9.2.0",
]

[project.scripts]
aggervation = "aggervation.main:main"
aggervation-web = "aggervation.web.server:main"
